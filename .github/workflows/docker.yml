# Builds the app image on every push to main and publishes it to GitHub's container registry:
#   ghcr.io/orcsbane1369/work-hours:latest
# Unraid then just pulls that image, so nothing has to be built on the server.
name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Do not publish an image if the tests fail.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_calc.py
      - run: python test_app.py

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/orcsbane1369/work-hours:latest
            ghcr.io/orcsbane1369/work-hours:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/orcsbane1369/Work-Hours
            org.opencontainers.image.revision=${{ github.sha }}
