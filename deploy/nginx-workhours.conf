# OPTIONAL. You do not need nginx for this app: the simplest setup points the Cloudflare Tunnel straight at the app
# container (see DEPLOY.md). Use this only if you specifically want requests to pass through binhex-nginx.
#
# I have not verified where binhex-nginx reads its site configs (look under /mnt/user/appdata/binhex-nginx/). The
# important parts are below. Because binhex-nginx is on Unraid's default "bridge" network it cannot look up the name
# "workhours", so it must use your Unraid server's LAN address and the published port.

server {
    listen 8080;                         # inside the container; Unraid maps it (your 8081)
    server_name hours.yourdomain.com;
    client_max_body_size 1m;

    location / {
        proxy_pass http://192.168.1.50:5005;          # <-- your Unraid server's IP and the app's host port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        # CF-Connecting-IP (the real visitor address) passes through on its own.
    }
}
